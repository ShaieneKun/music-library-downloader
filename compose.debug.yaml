services:
  music-library-downloader:
    image: music-library-downloader
    build:
      context: .
      dockerfile: ./Containerfile
    env_file:
      - .env
    command: ["sh", "-c", "pip install debugpy -t /tmp && python /tmp/debugpy --wait-for-client --listen 0.0.0.0:5678 main.py"]
    ports:
      - 5678:5678
    volumes:
      - data:/data
      - type: bind
        source: ${MUSIC_DIR:-${HOME}/Music}
        target: /data/songs
        bind:
          create_host_path: true

volumes:
  data:
