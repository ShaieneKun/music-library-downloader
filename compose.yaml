services:
  music-library-downloader:
    image: music-library-downloader
    build:
      context: .
      dockerfile: ./Containerfile
    container_name: music-library-downloader
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Host path of the songs directory, only shown in the cycle summary.
      HOST_MUSIC_DIR: ${MUSIC_DIR:-${HOME}/Music}
      # Real host name for the summary (container hostname if empty).
      HOST_HOSTNAME: ${HOST_HOSTNAME:-}
    volumes:
      # State (Drive token, upload record) and logs live in a named volume.
      - data:/data
      # Songs go to a host directory (MUSIC_DIR in .env, default ~/Music).
      # Docker creates it if it doesn't exist.
      - type: bind
        source: ${MUSIC_DIR:-${HOME}/Music}
        target: /data/songs
        bind:
          create_host_path: true
    stop_grace_period: 30s

volumes:
  data:
